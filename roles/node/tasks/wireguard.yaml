---
# roles/host/tasks/wireguard.yaml
# Host-level WireGuard via wg-quick, for attaching a host to a WireGuard peer
# (e.g. the internet-exposed, Docker-less Infomaniak VPS cloud01 joining the
# StumpCloud UniFi gateway). Runs as a systemd wg-quick@<iface> unit, NOT a
# container. Split-tunnel AllowedIPs keep the host's public reachability intact.
#
# The interface private key comes from Vault via the control node, so the config
# render is skipped under ansible-pull self-heal (ansible_pull_mode): the on-disk
# config and the enabled unit persist untouched. Full autonomy (re-rendering on
# the box) arrives with Vault Agent.
#
# Governing: ADR-0041 (host-level WireGuard mesh attachment), ADR-0002 (host
# bootstrap pipeline).

- name: Ensure wireguard-tools is installed
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: false

- name: Ensure /etc/wireguard exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render WireGuard interface config
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ host_wireguard.interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  when: not (ansible_pull_mode | default(false))
  register: _wg_conf
  no_log: true  # rendered file contains the private key

- name: Enable and (re)start wg-quick@{{ host_wireguard.interface }}
  ansible.builtin.systemd:
    name: "wg-quick@{{ host_wireguard.interface }}"
    enabled: true
    state: "{{ 'restarted' if (_wg_conf.changed | default(false)) else 'started' }}"
