# tvdinner CI: lint + unit tests + secret scan on the host runner.
# Runs the same `make` targets as local development (repo convention).
# Deliberately NOT using actions/setup-python — it does not work on this
# act_runner (see switchboard's CI design notes); system python3 + pip does.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling (venv — system pip is externally managed)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --disable-pip-version-check yamllint flake8
      - run: PATH=/tmp/venv/bin:$PATH make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling (venv — system pip is externally managed)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --disable-pip-version-check ansible-core pytest
      - run: PATH=/tmp/venv/bin:$PATH make test

  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling (venv — system pip is externally managed)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --disable-pip-version-check ansible-core molecule molecule-plugins[docker] pytest-testinfra docker
      - run: PATH=/tmp/venv/bin:$PATH make molecule

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --redact --verbose --source .
